<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Gross Reporting</title>
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body style="background-color: #f8fafc; display: flex; align-items: center; justify-content: center; min-height: 100vh;">

    <div class="auth-card">
        <div class="auth-icon-badge">
            <i class="fa-solid fa-user-plus"></i>
        </div>
        <h1 class="auth-title">Create Account</h1>
        <p class="auth-subtitle">Register for Pathology Gross Reporting System</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div style="padding: 10px 14px; margin-bottom: 16px; border-radius: 8px; font-size: 13px; background-color: {% if category == 'success' %}#dcfce7; color: #15803d;{% elif category == 'danger' %}#fee2e2; color: #b91c1c;{% else %}#e0f2fe; color: #0369a1;{% endif %}">
            {{ message }}
        </div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('register') }}">
            <div class="auth-field">
                <label for="name"><i class="fa-solid fa-id-card" style="color: #64748b;"></i> Full Name (Doctor / Resident)</label>
                <input type="text" id="name" name="name" required placeholder="Dr. Somsak ...">
            </div>

            <div class="auth-field">
                <label for="username"><i class="fa-regular fa-user" style="color: #64748b;"></i> Username</label>
                <input type="text" id="username" name="username" required placeholder="doctor1">
            </div>

            <div class="auth-field">
                <label for="email"><i class="fa-regular fa-envelope" style="color: #64748b;"></i> Email</label>
                <input type="email" id="email" name="email" required placeholder="doctor@kku.ac.th">
            </div>

            <div class="auth-field">
                <label for="password"><i class="fa-solid fa-lock" style="color: #64748b;"></i> Password</label>
                <input type="password" id="password" name="password" required placeholder="Create a secure password">
            </div>

            <button type="submit" class="btn-primary-dark">
                <i class="fa-solid fa-user-check"></i> Register Account
            </button>
        </form>

        <div style="margin-top: 18px; text-align: center; font-size: 13px;">
            <a href="{{ url_for('login') }}" style="color: #2563eb; font-weight: 600; text-decoration: none;">Already have an account? Sign in</a>
        </div>

        <div class="auth-footer-logos">
            <div class="auth-institutions-label">Khon Kaen University</div>
            <div class="auth-logos-grid">
                <div class="logo-item" title="Department of Pathology, Faculty of Medicine, Khon Kaen University">
                    <img src="{{ url_for('static', filename='images/logo_med_patho_kku.png') }}" alt="Department of Pathology, Faculty of Medicine, Khon Kaen University">
                </div>
                <div class="logo-divider"></div>
                <div class="logo-item" title="College of Computing, Khon Kaen University">
                    <img src="{{ url_for('static', filename='images/logo_cp_kku.png') }}" alt="College of Computing, Khon Kaen University">
                </div>
            </div>
        </div>
    </div>

</body>
</html>
