<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - Gross Reporting</title>
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body style="background-color: #f8fafc; display: flex; align-items: center; justify-content: center; min-height: 100vh;">

    <div class="auth-card">
        <h1 class="auth-title">Gross reporting</h1>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div style="padding: 10px 14px; margin-bottom: 16px; border-radius: 8px; font-size: 13px; background-color: {% if category == 'success' %}#dcfce7; color: #15803d;{% elif category == 'danger' %}#fee2e2; color: #b91c1c;{% else %}#e0f2fe; color: #0369a1;{% endif %}">
            {{ message }}
        </div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('login') }}">
            <div class="auth-field">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autofocus placeholder="Enter your username">
            </div>

            <div class="auth-field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Enter your password">
            </div>

            <button type="submit" class="btn-primary-dark" style="margin-top: 10px;">
                Sign in
            </button>
        </form>

        <div style="margin-top: 16px; display: flex; justify-content: space-between; font-size: 12px;">
            <a href="{{ url_for('register') }}" style="color: var(--text-muted); text-decoration: none;">Create account</a>
            <a href="{{ url_for('forgot_password') }}" style="color: var(--text-muted); text-decoration: none;">Forgot password?</a>
        </div>

        <div class="auth-footer-logos">
            <div style="display: flex; align-items: center; gap: 8px; color: var(--text-muted); font-size: 11px; font-weight: 600;">
                <i class="fas fa-microscope" style="font-size: 18px; color: #64748b;"></i>
                <span>Pathology Clinical Lab</span>
            </div>
            <div style="width: 1px; height: 16px; background: #cbd5e1;"></div>
            <div style="display: flex; align-items: center; gap: 8px; color: var(--text-muted); font-size: 11px; font-weight: 600;">
                <i class="fas fa-brain" style="color: var(--accent-blue);"></i>
                <span>PathoVoice AI Core</span>
            </div>
        </div>
    </div>

</body>
</html>
